<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
  <defs>
    <linearGradient id="wingLilac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BBA5FF"/>
      <stop offset="48%" stop-color="#D9C9FF"/>
      <stop offset="100%" stop-color="#A8DDF8"/>
    </linearGradient>

    <linearGradient id="wingPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7C5ED"/>
      <stop offset="52%" stop-color="#D7C9FF"/>
      <stop offset="100%" stop-color="#A8E5E8"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Alas izquierdas -->
  <g class="wing-left" filter="url(#softGlow)">
    <path
      d="M98 87
         C77 66 55 23 34 29
         C9 37 20 78 43 96
         C59 108 79 103 98 91 Z"
      fill="url(#wingLilac)"
      fill-opacity=".72"
      stroke="#DCCEFF"
      stroke-width="2.5"
    />

    <path
      d="M96 94
         C75 99 57 112 61 133
         C65 151 84 144 99 112 Z"
      fill="url(#wingLilac)"
      fill-opacity=".76"
      stroke="#DCCEFF"
      stroke-width="2.5"
    />

    <g fill="none" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="1.4">
      <path d="M98 86 L42 43"/>
      <path d="M95 92 L32 70"/>
      <path d="M96 96 L69 132"/>
    </g>
  </g>

  <!-- Alas derechas -->
  <g class="wing-right" filter="url(#softGlow)">
    <path
      d="M102 87
         C123 66 145 23 166 29
         C191 37 180 78 157 96
         C141 108 121 103 102 91 Z"
      fill="url(#wingPink)"
      fill-opacity=".72"
      stroke="#F1C9EF"
      stroke-width="2.5"
    />

    <path
      d="M104 94
         C125 99 143 112 139 133
         C135 151 116 144 101 112 Z"
      fill="url(#wingPink)"
      fill-opacity=".76"
      stroke="#C8DFFF"
      stroke-width="2.5"
    />

    <g fill="none" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="1.4">
      <path d="M102 86 L158 43"/>
      <path d="M105 92 L168 70"/>
      <path d="M104 96 L131 132"/>
    </g>
  </g>

  <!-- Cuerpo -->
  <g class="butterfly-body">
    <path
      d="M100 77
         C95 91 96 111 100 122
         C104 111 105 91 100 77 Z"
      fill="#8064D9"
      stroke="#FFFFFF"
      stroke-width="1.5"
    />

    <!-- Antenas -->
    <g fill="none" stroke="#9677E8" stroke-width="2.2" stroke-linecap="round">
      <path d="M99 80 C90 65 82 60 76 55"/>
      <path d="M101 80 C110 65 118 60 124 55"/>
    </g>

    <g fill="#F8D6F2" stroke="#FFFFFF" stroke-width="1.3">
      <circle cx="76" cy="55" r="3"/>
      <circle cx="124" cy="55" r="3"/>
    </g>
  </g>
</svg>
